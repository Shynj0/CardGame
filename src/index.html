<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireCards - Login</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="logo-header">
            <img src="assets/img/Logo.png" alt="FireCards" style="max-height: 200px; width: auto;">
        </div>

        <div class="login-card">
            <div class="tabs">
                <button class="tab-btn active">Entrar</button>
                <button class="tab-btn">Criar minha conta</button>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>

                <div class="remember-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar</label>
                </div>

                <button type="submit" class="btn-primary btn-block">Acessar</button>
            </form>
        </div>
        <div class="footer-links">
            <a href="#">Termos de Uso</a> | <a href="#">Política de Privacidade</a>
        </div>
    </div>

    <!-- Script de autenticação (será criado depois) -->
    <script src="js/auth.js"></script>
</body>

</html>
